server {
    listen 80;
    listen [::]:80;
    server_name aminoacidsupplements.co www.aminoacidsupplements.co;

    root /var/www/aminoacidsupplements;
    index index.html;

    # Enterprise Security & Isolation Headers (100/100 Best Practices)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Immediate 0ms resolution for Cloudflare RUM beacon
    location = /cdn-cgi/rum {
        access_log off;
        return 204;
    }

    # ARD Agentic Catalog with accurate MIME and CORS
    location ~* ^/(\.well-known/)?ai-catalog\.json$ {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Next.js Static Asset Hash Chunks (1 Year Immutable Cache)
    location ^~ /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # High-Performance Image Caching (30 Days Immutable)
    location ~* ^/images/.*\.(webp|png|jpg|jpeg|svg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Webfonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Discovery & Structured Sitemaps (1 Day Freshness)
    location ~* \.(xml|txt|xsl)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Next.js Static Clean Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    error_page 404 /404.html;
}
