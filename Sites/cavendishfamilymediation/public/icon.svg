<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_cavendish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad_cavendish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="subtleGlow_cavendish" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Prestige Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad_cavendish)" stroke="#064e3b" stroke-width="12" />

  <!-- Scales of Justice Crest (FMC Accredited Authority Symbol) -->
  <g transform="translate(106, 106) scale(12.5)" stroke="url(#goldGrad_cavendish)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow_cavendish)">
    <!-- Central Pillar -->
    <path d="M12 3v18" />
    <!-- Finial Ring / Balance Fulcrum -->
    <circle cx="12" cy="3" r="0.8" fill="url(#goldGrad_cavendish)" />
    <!-- Cross Beam -->
    <path d="M6 7l6-2 6 2" />
    <!-- Center Pivot Ring -->
    <circle cx="12" cy="5" r="0.6" fill="url(#goldGrad_cavendish)" />
    <!-- Left Balance Pan -->
    <path d="M3 13l3-6 3 6a3 3 0 0 1-6 0z" fill="url(#goldGrad_cavendish)" fill-opacity="0.18" />
    <!-- Right Balance Pan -->
    <path d="M15 13l3-6 3 6a3 3 0 0 1-6 0z" fill="url(#goldGrad_cavendish)" fill-opacity="0.18" />
    <!-- Base Pedestal -->
    <path d="M4 21h16" stroke-width="2.2" />
  </g>
</svg>
