<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02102b" />
      <stop offset="100%" stop-color="#061a3d" />
    </linearGradient>
    <linearGradient id="tpCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Prestige Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tpBg)" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="12" />

  <!-- Laboratory Flask & Molecular Bonds -->
  <g transform="translate(80, 80) scale(11)" stroke="url(#tpCyan)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Lab Flask Neck & Lip -->
    <path d="M12 4h8" />
    <path d="M14 4v7L7 24h18l-7-13V4" fill="url(#tpCyan)" fill-opacity="0.15" />
    <path d="M14 11h4" stroke-opacity="0.5" stroke-dasharray="1 1" />
    <!-- Molecular Reaction Nodes -->
    <circle cx="16" cy="18" r="1.8" fill="#10B981" stroke="#10B981" />
    <circle cx="11.5" cy="21" r="1.3" fill="#00F2FE" stroke="#00F2FE" />
    <circle cx="20.5" cy="21" r="1.3" fill="#00F2FE" stroke="#00F2FE" />
  </g>
</svg>