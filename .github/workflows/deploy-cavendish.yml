name: Deploy Cavendish Family Mediation to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'Sites/cavendishfamilymediation/**'
      - 'packages/**'
      - '.github/workflows/deploy-cavendish.yml'
  workflow_dispatch:

jobs:
  deploy-cavendish:
    name: Build & FTPS Deploy Cavendish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cavendish Static Export
        run: pnpm --filter "./Sites/cavendishfamilymediation" run build

      - name: Copy .htaccess to Output
        run: cp Sites/cavendishfamilymediation/public/.htaccess Sites/cavendishfamilymediation/out/.htaccess

      - name: Sync Static Export to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 's688.lon1.mysecurecloudhost.com' }}
          username: ${{ secrets.FTP_CAVENDISH_USERNAME || 'cavendish@mediationdirect.co.uk' }}
          password: ${{ secrets.FTP_CAVENDISH_PASSWORD || 'eOfia5JLHt6D2qNhdgmLw35z' }}
          protocol: ftps
          port: 21
          server-dir: /
          local-dir: ./Sites/cavendishfamilymediation/out/
          dangerous-clean-slate: false
